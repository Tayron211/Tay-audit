<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tay-Audit" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="msapplication-navbutton-color" content="#000000" />
    <meta name="msapplication-TileColor" content="#000000" />
    <title>Tay-Audit | Auditoría & Inventario TI Inteligente</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts Institucionales UPN Oficiales (Plus Jakarta Sans, Space Grotesk, JetBrains Mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      @keyframes splashProgress {
        0% { left: 0%; width: 0%; opacity: 0.5; }
        50% { left: 25%; width: 60%; opacity: 1; }
        100% { left: 100%; width: 15%; opacity: 0.3; }
      }
      /* Contenedor principal de la app (visibilidad instantánea sin retrasos en negro) */
      #root {
        opacity: 1 !important;
      }
      /* Splash Screen adaptativo Institucional UPN (Geometría fija sin saltos en APK) */
      #upn-boot-splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        z-index: 999999;
        user-select: none;
        -webkit-user-select: none;
        overflow: hidden !important;
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        contain: layout paint size;
      }
      html.dark #upn-boot-splash, [data-mode="dark"] #upn-boot-splash {
        background-color: #000000 !important;
        color-scheme: dark;
      }
      html:not(.dark) #upn-boot-splash, [data-mode="light"] #upn-boot-splash {
        background-color: #edf0f5 !important;
        color-scheme: light;
      }
      html.dark .splash-text-title, [data-mode="dark"] .splash-text-title { color: #ffffff !important; }
      html:not(.dark) .splash-text-title, [data-mode="light"] .splash-text-title { color: #0f172a !important; }
      html.dark .splash-text-muted, [data-mode="dark"] .splash-text-muted { color: #a1a1aa !important; }
      html:not(.dark) .splash-text-muted, [data-mode="light"] .splash-text-muted { color: #64748b !important; }
      html.dark .splash-loader-track, [data-mode="dark"] .splash-loader-track { background-color: rgba(63, 63, 70, 0.7) !important; }
      html:not(.dark) .splash-loader-track, [data-mode="light"] .splash-loader-track { background-color: rgba(226, 232, 240, 0.95) !important; }
      html.dark .splash-glow, [data-mode="dark"] .splash-glow { background: radial-gradient(circle, rgba(253,186,48,0.22) 0%, rgba(0,0,0,0) 70%) !important; }
      html:not(.dark) .splash-glow, [data-mode="light"] .splash-glow { background: radial-gradient(circle, rgba(253,186,48,0.20) 0%, rgba(255,255,255,0) 70%) !important; }
      .splash-logo-card {
        background-color: #FDBA30;
        box-shadow: 0 8px 30px rgba(253, 186, 48, 0.35);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
    </style>
    <script>
      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
          window.addEventListener('beforeunload', function() {
            window.scrollTo(0, 0);
          });
          var mode = localStorage.getItem('tay_audit_colormode') || 'light';
          var theme = localStorage.getItem('tay_audit_theme') || 'upn';
          document.documentElement.setAttribute('data-mode', mode);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = mode;
          if (mode === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }

          var themeColor = mode === 'light' ? '#edf0f5' : '#000000';
          var themeMetas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < themeMetas.length; i++) {
            themeMetas[i].setAttribute('content', themeColor);
          }

          var schemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (schemeMeta) {
            schemeMeta.setAttribute('content', mode);
          }

          var appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleMeta) {
            appleMeta.setAttribute('content', mode === 'dark' ? 'black-translucent' : 'default');
          }

          var msMeta = document.querySelector('meta[name="msapplication-navbutton-color"]');
          if (msMeta) {
            msMeta.setAttribute('content', themeColor);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="overscroll-none touch-manipulation">
    <!-- Sovereign Splash Screen: anclado con coordenadas absolutas inmutables para cero saltos en APK -->
    <div id="upn-boot-splash">
      <!-- Ambient Glow Adaptable -->
      <div class="splash-glow" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:350px;height:350px;border-radius:9999px;pointer-events:none;filter:blur(40px);"></div>
      
      <!-- Top Institutional Label (Ligeramente más bajo para equilibrio visual) -->
      <div class="splash-text-muted" style="position:absolute;top:72px;left:0;right:0;font-size:11px;line-height:14px;text-transform:uppercase;font-family:monospace;letter-spacing:0.25em;font-weight:700;z-index:2;text-align:center;">
        Universidad Privada del Norte
      </div>
      
      <!-- Center Identity Core (Bloqueado al 50% exacto con SVG inline sincrónico para cero saltos en APK) -->
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center;width:280px;z-index:2;">
        <div class="splash-logo-card" style="width:80px;height:80px;border-radius:19px;display:flex;align-items:center;justify-content:center;padding:12px;margin-bottom:20px;box-sizing:border-box;">
          <svg width="56" height="56" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:56px;height:56px;display:block;flex-shrink:0;">
            <g transform="translate(-124.05, -26.6)">
              <path d="M277.3 62.4001V310.8H241V128.8L240 129.7C224 144.8 206.2 158.1 187.2 169.3V128.2C197.2 121.2 206.7 113.5 215.6 105.2C229.4 92.3 241.9 77.9 252.7 62.3H277.3V62.4001Z" fill="black" />
              <path d="M380.9 128.3V169.4C361.8 158.2 344.1 144.8 328.1 129.8L327.1 128.9V310.9H290.8V62.3999H315.5C326.3 77.9999 338.7 92.3999 352.6 105.3C361.4 113.6 370.9 121.3 380.9 128.3Z" fill="black" />
            </g>
          </svg>
        </div>
        <h1 class="splash-text-title" style="font-size:22px;height:27px;line-height:27px;font-weight:800;letter-spacing:0.20em;text-transform:uppercase;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;margin:0;white-space:nowrap;">
          TAY<span style="color:#FDBA30;">-AUDIT</span>
        </h1>
        <div class="splash-text-muted" style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;height:16px;line-height:16px;font-size:11px;font-family:monospace;letter-spacing:0.15em;text-transform:uppercase;font-weight:600;white-space:nowrap;">
          <span>Campus Comas</span>
          <span style="display:inline-block;width:4px;height:4px;border-radius:9999px;background-color:#52525b;"></span>
          <span style="color:#FDBA30;font-weight:700;">Operaciones TI</span>
        </div>
        <!-- Hairline Loader -->
        <div class="splash-loader-track" style="width:144px;height:2.5px;border-radius:9999px;margin-top:28px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;bottom:0;left:0;background-color:#FDBA30;border-radius:9999px;box-shadow:0 0 10px rgba(253,186,48,0.7);animation:splashProgress 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
        </div>
      </div>
      
      <!-- Footer -->
      <div class="splash-text-muted" style="position:absolute;bottom:36px;left:0;right:0;font-size:10px;line-height:14px;font-family:monospace;text-transform:uppercase;letter-spacing:0.15em;z-index:2;text-align:center;">
        <span>Tay-Audit & STIVIE Cloud 24/7</span>
      </div>
    </div>

    <!-- Safety Fallback & Auto-Heal de Caché: transición suave tras 2.2s y jamás dejar la pantalla bloqueada -->
    <script>
      (function() {
        // 1. Si estamos en APK nativo (localhost) o si un chunk JS viejo falla por actualización, limpiar caché de Service Worker automáticamente
        try {
          if (window.location.hostname === 'localhost' && 'serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                for (var j = 0; j < keys.length; j++) {
                  caches.delete(keys[j]);
                }
              }).catch(function() {});
            }
          }

          window.addEventListener('error', function(e) {
            var t = e && e.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
              var src = t.src || t.href || '';
              if (src.indexOf('/assets/') !== -1 && !sessionStorage.getItem('tay_asset_healed')) {
                sessionStorage.setItem('tay_asset_healed', '1');
                var p = Promise.resolve();
                if ('serviceWorker' in navigator) {
                  p = navigator.serviceWorker.getRegistrations().then(function(regs) {
                    return Promise.all(regs.map(function(r) { return r.unregister(); }));
                  }).catch(function() {});
                }
                p.then(function() {
                  if ('caches' in window) {
                    return caches.keys().then(function(keys) {
                      return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                    });
                  }
                }).finally(function() {
                  window.location.reload();
                });
              }
            }
          }, true);
        } catch (err) {}

        // 2. Desvanecimiento garantizado del Splash Screen institucional (~2.2 segundos)
        window.__dismissUpnSplash = function() {
          var splash = document.getElementById('upn-boot-splash');
          var root = document.getElementById('root');
          if (root) root.classList.add('app-ready');
          document.documentElement.classList.remove('splash-active');
          if (document.body) document.body.classList.remove('splash-active');
          if (splash && !splash.getAttribute('data-dismissing')) {
            splash.setAttribute('data-dismissing', 'true');
            splash.style.transition = 'opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1)';
            splash.style.opacity = '0';
            splash.style.pointerEvents = 'none';
            setTimeout(function() {
              if (splash && splash.parentNode) {
                splash.parentNode.removeChild(splash);
              }
            }, 600);
          }
        };

        setTimeout(function() {
          if (window.__dismissUpnSplash) window.__dismissUpnSplash();
        }, 2350);
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
