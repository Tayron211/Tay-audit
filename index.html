<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070c1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tay-Audit" />
    <meta name="msapplication-navbutton-color" content="#070c1e" />
    <meta name="msapplication-TileColor" content="#070c1e" />
    <title>Tay-Audit | Auditoría & Inventario TI Inteligente</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts Institucionales UPN (Neo-Grotesque & Monospace) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
          }
          window.scrollTo(0, 0);
          window.addEventListener('beforeunload', function() {
            window.scrollTo(0, 0);
          });
          var mode = localStorage.getItem('tay_audit_colormode') || 'dark';
          var theme = localStorage.getItem('tay_audit_theme') || 'upn';
          document.documentElement.setAttribute('data-mode', mode);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = mode;

          var themeColor = mode === 'light' ? '#f8fafc' : '#070c1e';
          var themeMetas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < themeMetas.length; i++) {
            themeMetas[i].setAttribute('content', themeColor);
          }

          var schemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (schemeMeta) {
            schemeMeta.setAttribute('content', mode);
          }

          var appleMeta = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleMeta) {
            appleMeta.setAttribute('content', mode === 'dark' ? 'black-translucent' : 'default');
          }

          var msMeta = document.querySelector('meta[name="msapplication-navbutton-color"]');
          if (msMeta) {
            msMeta.setAttribute('content', themeColor);
          }

          // Forzar modo inmersivo automáticamente SOLO en teléfonos móviles (NUNCA en computadoras / PC)
          function isMobileDevice() {
            var ua = navigator.userAgent || '';
            var isMobileUa = /android|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(ua);
            var isSmallTouch = ('ontouchstart' in window || navigator.maxTouchPoints > 0) && window.innerWidth <= 820;
            return isMobileUa || isSmallTouch;
          }

          function triggerAutoImmersive() {
            if (!isMobileDevice()) return; // En PC NUNCA forzar pantalla completa
            try {
              var doc = document.documentElement;
              if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (doc.requestFullscreen) {
                  doc.requestFullscreen().catch(function() {});
                } else if (doc.webkitRequestFullscreen) {
                  doc.webkitRequestFullscreen();
                }
              }
            } catch (e) {}
          }
          window.addEventListener('touchstart', triggerAutoImmersive, { passive: true });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
